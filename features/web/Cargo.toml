[package]
name = "riff-web"
description = "Web search and verbatim page fetch for coding agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "socks", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "logging", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.10.9"
supermarkdown = { version = "0.0.6", default-features = false }
thiserror = "1.0.69"
tokio = { version = "1.54.1", features = ["full"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
